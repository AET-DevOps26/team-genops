services:
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Maintenance DB only. Per-service databases are created by services/db/initdb.
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Per-service databases are declared once here; runs on first init only.
      - ./services/db/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genops} -d ${POSTGRES_DB:-genops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    # Dev tool only — do not include in Kubernetes manifests
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres-db:
        condition: service_healthy

  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
    container_name: web-client
    restart: unless-stopped
    ports:
      - "5173:80"
    # nginx proxies /api to the gateway (not auth directly), so local dev exercises
    # the same edge validation + cookie->Bearer path as the AKS/Rancher clusters.
    depends_on:
      gateway:
        condition: service_healthy

  gateway:
    # Spring Cloud Gateway — the real API gateway, mirroring the cluster topology.
    # Validates the access JWT at the edge and translates the jr_access cookie into
    # an Authorization: Bearer header before forwarding to auth.
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8081:8081"
      # Management port (health + metrics) — host-published so the e2e suite can
      # probe readiness the same way the kubelet does (never via the routed port).
      - "8090:8090"
    environment:
      AUTH_URI: http://auth:8080
      WEB_CLIENT_URI: http://web-client:80
      GENAI_URI: http://genai:8000
      DOCUMENT_URI: http://document:8080
      APPLICATION_URI: http://application:8080
      AUTH_JWKS_URL: http://auth:8080/api/v1/auth/.well-known/jwks.json
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: auth
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      # Per-IP register throttle (default 10/15min). The e2e suite registers ~20
      # users from one IP per run, so CI raises this; leave unset for prod-like local.
      AUTH_REGISTER_MAX_ATTEMPTS: ${AUTH_REGISTER_MAX_ATTEMPTS:-10}
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  application:
    build:
      context: ./services/application
      dockerfile: Dockerfile
    container_name: application
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_JWKS_URL: http://auth:8080/api/v1/auth/.well-known/jwks.json
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    depends_on:
      postgres-db:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  document:
    build:
      context: ./services/document
      dockerfile: Dockerfile
    container_name: document
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_JWKS_URL: http://auth:8080/api/v1/auth/.well-known/jwks.json
    depends_on:
      postgres-db:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  email:
    build:
      context: ./services/email
      dockerfile: Dockerfile
    container_name: email
    restart: unless-stopped
    ports:
      - "8001:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_JWKS_URL: http://auth:8080/api/v1/auth/.well-known/jwks.json
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8001/api/v1/email/connections/gmail/callback}
      FRONTEND_REDIRECT_URL: ${FRONTEND_REDIRECT_URL:-http://localhost:5173}
      EMAIL_TOKEN_ENC_KEY: ${EMAIL_TOKEN_ENC_KEY}
      STATE_SIGNING_KEY: ${STATE_SIGNING_KEY:-${EMAIL_TOKEN_ENC_KEY}}
      EMAIL_POLL_INTERVAL_SECONDS: ${EMAIL_POLL_INTERVAL_SECONDS:-300}
      # Application-detection pipeline. Blank token disables it (fail-closed).
      GENAI_URL: http://genai:8000
      APPLICATION_SERVICE_URL: http://application:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    depends_on:
      postgres-db:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  genai:
    build:
      context: ./services/genai
      dockerfile: Dockerfile
    container_name: genai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-120b}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-qwen/qwen3-embedding-8b}
      AUTH_JWKS_URL: http://auth:8080/api/v1/auth/.well-known/jwks.json
      DOCUMENT_SERVICE_URL: http://document:8080
      APPLICATION_SERVICE_URL: http://application:8080
      PROFILE_ENABLED: "true"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      # Langfuse tracing. Blank keys (the default) disable tracing, so genai runs
      # without the monitoring stack. Set both in .env and start with the
      # `monitoring` profile to send traces to the local Langfuse instance.
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    depends_on:
      postgres-db:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
