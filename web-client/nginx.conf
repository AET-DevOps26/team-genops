map $http_authorization $effective_auth {
    # If caller supplies an Authorization header, use it; otherwise fall back to cookie
    default $http_authorization;
    "" "Bearer $cookie_jr_access";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve upstream names at request time, not startup, so nginx still boots
    # when a backend (e.g. genai) isn't deployed. 127.0.0.11 is Docker's embedded
    # DNS (compose); in k8s these /api routes are handled by the gateway, not here.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA shell: serve index.html for any non-file route so client-side
    # routing (react-router) survives hard refreshes on deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # GenAI service — must come before the catch-all /api/ block so nginx's
    # longest-prefix rule routes /api/v1/chat/* to genai instead of auth.
    # Gateway responsibility: translate the jr_access HttpOnly cookie into an
    # Authorization: Bearer header so genai can verify the JWT without reading
    # cookies directly (genai uses HTTPBearer, not cookie auth).
    # Preserves caller-supplied Authorization header when present (non-browser clients).
    location /api/v1/chat/ {
        set $upstream_genai http://genai:8000;
        proxy_pass $upstream_genai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $effective_auth;
    }

    # Auth service catch-all — forwards everything else under /api/ to auth.
    # HttpOnly session cookies remain first-party. This is the dev/docker stand-in
    # for the future NGF gateway (PROJ-S02).
    location /api/ {
        set $upstream_auth http://auth:8080;
        proxy_pass $upstream_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
