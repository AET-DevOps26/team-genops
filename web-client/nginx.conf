server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA shell: serve index.html for any non-file route so client-side
    # routing (react-router) survives hard refreshes on deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: forward to the auth service so the browser stays single-origin and the
    # HttpOnly session cookies remain first-party. This is the dev/docker stand-in
    # for the future NGF gateway (PROJ-S02) — for now it just proxies; auth resolves
    # the token from the cookie itself.
    location /api/ {
        proxy_pass http://auth:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
