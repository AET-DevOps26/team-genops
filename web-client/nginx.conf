server {
    listen 80;
    # Set the root directory. This is where the static files for the web client are located.
    root /usr/share/nginx/html;
    # When a request resolve to a DIRECTORY, serve this file from inside it.
    # Without index, a directory request resolves to a directory, serve this file
    # from inside it.
    index index.html;

    # Resolve upstream names at request time, not startup, so nginx still boots
    # when the gateway isn't up yet. 127.0.0.11 is Docker's embedded DNS (compose).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA shell: serve index.html for any non-file route so client-side
    # routing (react-router) survives hard refreshes on deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $upstream_gateway http://gateway:8081;
        proxy_pass $upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
