spring.application.name=document
# Container listens on 8080; compose remaps it to the documented 8083 on the host.
# Non-Docker local dev overrides this to 8083 (see application-local.properties).
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only validates it.
spring.flyway.enabled=true
spring.flyway.default-schema=document
spring.flyway.schemas=document

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=document

# Actuator lives on its own port so metrics/health never share the public app
# port — the ingress cannot reach 8090 by construction (Services only route the
# app port). Prometheus scrapes /actuator/prometheus here.
management.server.port=8090
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true

# This service only verifies JWTs — it fetches auth's public key from the JWK Set.
# It never signs tokens, so no private key is configured here.
auth.jwks-url=${AUTH_JWKS_URL:http://localhost:8080/api/v1/auth/.well-known/jwks.json}
