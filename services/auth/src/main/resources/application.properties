spring.application.name=auth
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.public-key=${JWT_PUBLIC_KEY:}
jwt.access-token-expiry=900
jwt.refresh-token-expiry=604800
jwt.key-id=${JWT_KEY_ID:auth-key-1}
# iss/aud claims stamped into every access token and enforced by every verifier
# (auth, gateway, application, document, genai). Values must match across services.
jwt.issuer=${JWT_ISSUER:https://jobready-auth}
jwt.audience=${JWT_AUDIENCE:jobready}

# Browser origins allowed to make state-changing requests (CSRF origin check).
# Exactly one per deployed environment — the ingress host, https scheme. The
# local defaults cover the web-client (5173) and Swagger UI on auth itself (8080).
auth.security.allowed-origins=${AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

# Brute-force throttling (Redis-backed). Login locks an email+IP pairing after
# N failures; register is throttled per IP (mitigates the email-enumeration
# oracle documented in the README). One shared counting window for both.
auth.security.login-max-failures=${AUTH_LOGIN_MAX_FAILURES:5}
auth.security.register-max-attempts=${AUTH_REGISTER_MAX_ATTEMPTS:10}
auth.security.attempt-window-seconds=${AUTH_ATTEMPT_WINDOW_SECONDS:900}

# Session cookie policy: secure=true requires HTTPS; override per env.
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
