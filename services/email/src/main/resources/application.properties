spring.application.name=email
# Container listens on 8080; compose remaps it to the documented 8001 on the host.
# Non-Docker local dev overrides this to 8001 (see application-local.properties).
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only validates it.
spring.flyway.enabled=true
spring.flyway.default-schema=email
spring.flyway.schemas=email

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=email

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# This service only verifies JWTs — it fetches auth's public key from the JWK Set.
# It never signs tokens, so no private key is configured here.
auth.jwks-url=${AUTH_JWKS_URL:http://localhost:8080/api/v1/auth/.well-known/jwks.json}

# Gmail OAuth2 (see .env.example). The redirect URI must exactly match one registered in the
# Google Cloud console for the OAuth client.
email.google.client-id=${GOOGLE_CLIENT_ID:}
email.google.client-secret=${GOOGLE_CLIENT_SECRET:}
email.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8001/api/v1/email/connections/gmail/callback}
email.frontend-redirect-url=${FRONTEND_REDIRECT_URL:http://localhost:5173}

# Secrets: tokens-at-rest encryption key and the OAuth state signing key.
email.token-enc-key=${EMAIL_TOKEN_ENC_KEY:dev-only-change-me}
email.state.signing-key=${STATE_SIGNING_KEY:dev-only-change-me}
email.state.ttl-seconds=${STATE_TTL_SECONDS:600}

email.poll-interval-seconds=${EMAIL_POLL_INTERVAL_SECONDS:300}
email.gmail-max-results=${GMAIL_MAX_RESULTS:25}
