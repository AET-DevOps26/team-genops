[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend = "../../ruff.toml"
# alembic/ holds raw .sql migrations plus runner scaffolding — leave untouched.
extend-exclude = ["alembic"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["alembic"]
