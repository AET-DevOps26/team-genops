# The gateway verifies RS256 signatures locally using auth's published public key.
# Fetched lazily on first use, then cached — auth need not be up at gateway startup.
spring.application.name=gateway
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URL:http://auth:8080/api/v1/auth/.well-known/jwks.json}

# Routes are matched in declaration order, so every service-specific /api route
# MUST stay above the auth catch-all (/api/**) — otherwise auth swallows it and
# answers 404.
spring.cloud.gateway.server.webmvc.routes[0].id=genai
spring.cloud.gateway.server.webmvc.routes[0].uri=${GENAI_URI:http://genai:8000}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/chat/**

spring.cloud.gateway.server.webmvc.routes[1].id=document
spring.cloud.gateway.server.webmvc.routes[1].uri=${DOCUMENT_URI:http://document:8080}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/profile,/api/v1/profile/**,/api/v1/documents,/api/v1/documents/**

spring.cloud.gateway.server.webmvc.routes[2].id=application
spring.cloud.gateway.server.webmvc.routes[2].uri=${APPLICATION_URI:http://application:8080}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/applications,/api/v1/applications/**

spring.cloud.gateway.server.webmvc.routes[3].id=auth
spring.cloud.gateway.server.webmvc.routes[3].uri=${AUTH_URI:http://auth:8080}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/**

spring.cloud.gateway.server.webmvc.routes[4].id=web-client
spring.cloud.gateway.server.webmvc.routes[4].uri=${WEB_CLIENT_URI:http://web-client:80}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/**

server.port=${SERVER_PORT:8081}

# Only health (k8s probes) is exposed. `gateway` (route enumeration) and `info`
# are deliberately NOT exposed: the gateway sits at the edge, so any exposed
# actuator endpoint is reachable through the ingress. SecurityConfig also denies
# /actuator/** except the health probe group — defense in depth (exposure + authz).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.liveness.include=livenessState
