spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # GenAI service — must come before the generic /api/** route.
            - id: genai
              uri: ${GENAI_URI:http://genai:8000}
              predicates:
                - Path=/api/v1/chat/**
            # Application service — must come before the generic /api/** route.
            - id: application
              uri: ${APPLICATION_URI:http://application:8080}
              predicates:
                - Path=/api/v1/applications/**
            # Document service (profile + generated documents) — must come before
            # the generic /api/** route. Bare paths listed explicitly so the
            # collection endpoints match regardless of PathPattern semantics.
            - id: document
              uri: ${DOCUMENT_URI:http://document:8080}
              predicates:
                - Path=/api/v1/profile,/api/v1/profile/**,/api/v1/documents,/api/v1/documents/**
            # Auth service — catches remaining /api/** traffic.
            - id: auth
              uri: ${AUTH_URI:http://auth:8080}
              predicates:
                - Path=/api/**
            # Everything else -> the web-client (SPA shell + static assets).
            - id: web-client
              uri: ${WEB_CLIENT_URI:http://web-client:80}
              predicates:
                - Path=/**

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        # health for k8s probes; gateway to introspect routes at /actuator/gateway/routes
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState
