spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # API traffic -> auth service. More specific, so it must come first.
            - id: auth
              uri: ${AUTH_URI:http://auth:8080}
              predicates:
                - Path=/api/**
            # Everything else -> the web-client (SPA shell + static assets).
            - id: web-client
              uri: ${WEB_CLIENT_URI:http://web-client:80}
              predicates:
                - Path=/**

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        # health for k8s probes; gateway to introspect routes at /actuator/gateway/routes
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState
