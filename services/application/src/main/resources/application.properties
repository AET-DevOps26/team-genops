spring.application.name=application
# Container listens on 8080; compose remaps it to the documented 8082 on the host.
# Non-Docker local dev overrides this to 8082 (see application-local.properties).
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=application
# ddl-auto creates only the `applications` table (the entity), so Hibernate must also
# create the `application` schema namespace (no Flyway runs here to CREATE SCHEMA).
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# This service only verifies JWTs — it fetches auth's public key from the JWK Set.
# It never signs tokens, so no private key is configured here.
auth.jwks-url=${AUTH_JWKS_URL:http://localhost:8080/api/v1/auth/.well-known/jwks.json}

# Static shared secret guarding /internal/** (email-service pipeline). Blank disables the
# internal API entirely (fail-closed).
internal.service-token=${INTERNAL_SERVICE_TOKEN:}
