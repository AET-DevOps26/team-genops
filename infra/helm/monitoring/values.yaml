# Install into the monitoring namespace (never alongside app services):
#   helm upgrade --install monitoring infra/helm/monitoring -n genops-monitoring
#
# Hand-made prerequisite (never committed):
#   kubectl -n genops-monitoring create secret generic grafana-admin \
#     --from-literal=admin-password='<strong password>'

# The namespace the app chart (infra/helm/jobready) is deployed in — scrape
# targets live there; Prometheus gets a namespaced Role there to discover them.
appNamespace: ge86yog-devops-genops

prometheus:
  replicas: 1
  retention: 7d
  storageClassName: csi-rbd-sc
  storageSize: 5Gi
  scrapeInterval: 15s
  # Budgeted against the namespace's Rancher quota slice (800m / 1792Mi):
  # prometheus 400m/800Mi + config-reloader 50m/64Mi + grafana 200m/256Mi
  # leaves headroom for cert-manager's transient ACME solver pod (100m/64Mi).
  resources:
    requests:
      memory: 400Mi
      cpu: 100m
    limits:
      memory: 800Mi
      cpu: 400m
  # The operator injects config-reloader sidecars WITHOUT limits by default;
  # the namespace ResourceQuota requires limits on every container.
  configReloaderResources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 50m

grafana:
  image: grafana/grafana
  tag: 12.1.1
  # Name of the hand-made Secret holding key `admin-password`.
  adminSecret: grafana-admin
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

ingress:
  ingressClassName: nginx
  host: genops-grafana.stud.k8s.aet.cit.tum.de
  # PRODUCTION issuer — TUM defaults to the untrusted staging issuer without it.
  clusterIssuer: letsencrypt-prod
  tls:
    secretName: grafana-tls
