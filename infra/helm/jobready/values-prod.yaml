# Production overrides — TUM Rancher cluster `stud`, namespace ge86yog-devops-genops.
# Deploy with:  helm upgrade --install jobready infra/helm/jobready \
#                 -n ge86yog-devops-genops -f infra/helm/jobready/values-prod.yaml
# Image tags are pinned by CD at deploy time:  --set auth.tag=<sha> (etc.)
global:
  namespace: ge86yog-devops-genops
  imagePullPolicy: Always

namespace:
  # Tenant cannot create namespaces; it already exists. Use `helm -n <ns>`.
  create: false

postgres:
  storageClassName: csi-rbd-sc

# --- Prod CPU right-sizing (TUM namespace quota: limits.cpu=3400m) -----------
# Enabling email in prod (#141/#142) filled the last 500m of quota headroom,
# leaving zero room for rolling-update surges (maxSurge=1). During a full helm
# upgrade all 7 RollingUpdate services try to schedule a surge pod simultaneously,
# requiring ~6400m — instantly quota-blocked.
#
# Target: steady-state ≤ 1850m so worst-case surge fits:
#   surge = 7 × new-pod limits ≈ 1500m
#   total = 1800m + 1500m = 3300m ≤ 3400m (100m buffer)
#
# Observed idle CPU is ~12m per Spring service, so 200m limits give 16x headroom
# and absorb JVM startup bursts. Genai (Python) is lighter; 400m is comfortable.
auth:
  resources:
    limits:
      cpu: "200m"

application:
  resources:
    limits:
      cpu: "200m"

document:
  resources:
    limits:
      cpu: "200m"

email:
  # For manual helm runs. CD (Ansible deploy.yml) overrides this flag based on
  # whether the vault holds the Google credentials, so the service only starts
  # once they are provisioned.
  # Requires the email-secrets Secret (Ansible deploy.yml, vault_google_* etc.)
  # and the prod host's redirect URI registered in the Google Cloud console.
  enabled: true
  resources:
    limits:
      cpu: "200m"

gateway:
  resources:
    limits:
      cpu: "200m"

genai:
  # Reuse the genai-secrets Secret (created by Ansible deploy.yml) for Langfuse
  # Cloud keys too. Tracing stays off until the vault_langfuse_* vars are set.
  langfuseSecret: genai-secrets
  resources:
    limits:
      cpu: "400m"

networkPolicy:
  # Tenant isolation on the shared TUM cluster: default-deny + explicit allows.
  # Rollback is one flag: --set networkPolicy.enabled=false
  enabled: true
  ingressNamespace: ingress-nginx   # CONFIRM against the TUM platform controller
  probeCidr: ""                     # set to node CIDR if readiness probes fail
  # Our own monitoring stack (infra/helm/monitoring chart) scrapes from here.
  monitoringNamespace: genops-monitoring

ingress:
  host: jobready.stud.k8s.aet.cit.tum.de   # unique subdomain
  ingressClassName: nginx                                 # the platform ingress class
  clusterIssuer: letsencrypt-prod                         # production cert-manager issuer (trusted)
  tls:
    enabled: true
    secretName: jobready-tls
