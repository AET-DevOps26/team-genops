# Production overrides — TUM Rancher cluster `stud`, namespace ge86yog-devops-genops.
# Deploy with:  helm upgrade --install jobready infra/helm/jobready \
#                 -n ge86yog-devops-genops -f infra/helm/jobready/values-prod.yaml
# Image tags are pinned by CD at deploy time:  --set auth.tag=<sha> (etc.)
global:
  namespace: ge86yog-devops-genops
  imagePullPolicy: Always
  imagePullSecrets:
    - name: ghcr-pull

namespace:
  # Tenant cannot create namespaces; it already exists. Use `helm -n <ns>`.
  create: false

postgres:
  storageClassName: csi-rbd-sc

genai:
  # Reuse the genai-secrets Secret (created by Ansible deploy.yml) for Langfuse
  # Cloud keys too. Tracing stays off until the vault_langfuse_* vars are set.
  langfuseSecret: genai-secrets

ingress:
  # Confirmed from an existing working ingress on the cluster (2026-06-30).
  host: ge86yog-devops-genops.stud.k8s.aet.cit.tum.de   # unique subdomain (matches our namespace)
  ingressClassName: nginx                                 # the platform ingress class
  clusterIssuer: letsencrypt-prod                         # production cert-manager issuer (trusted)
  tls:
    enabled: true
    secretName: jobready-tls
