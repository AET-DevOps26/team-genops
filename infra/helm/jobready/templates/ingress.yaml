{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobready-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "jobready.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.clusterIssuer }}
    # cert-manager watches this annotation and auto-issues a cert into tls.secretName.
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    {{- end }}
    {{- if .Values.ingress.tls.enabled }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- if .Values.ingress.tls.enabled }}
  # The Secret named here is populated by cert-manager (when clusterIssuer is set)
  # or must be created manually:
  #   kubectl create secret tls jobready-tls --cert=cert.pem --key=key.pem -n <ns>
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.gateway.enabled }}
          # Gateway mode: everything goes to the API gateway, which fans out
          # internally (/api/** -> auth, /** -> web-client).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: {{ .Values.gateway.port }}
          {{- else }}
          # Direct mode: the ingress splits traffic itself.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: {{ .Values.auth.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-client
                port:
                  number: {{ .Values.webClient.port }}
          {{- end }}
{{- end }}
