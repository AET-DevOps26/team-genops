{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobready-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "jobready.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.ingressClassName }}
    {{- if .Values.ingress.tls.enabled }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- end }}
spec:
  {{- if .Values.ingress.tls.enabled }}
  # TLS block — only rendered when ingress.tls.enabled = true.
  # The Secret named here must contain tls.crt and tls.key.
  # You can create it with cert-manager (recommended) or manually:
  #   kubectl create secret tls jobready-tls \
  #     --cert=path/to/cert.pem --key=path/to/key.pem -n jobready
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: {{ .Values.auth.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-client
                port:
                  number: {{ .Values.webClient.port }}
{{- end }}
