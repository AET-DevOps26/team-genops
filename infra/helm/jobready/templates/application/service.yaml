apiVersion: v1
kind: Service
metadata:
  name: application
  namespace: {{ .Values.global.namespace }}
  labels:
    app: application
    monitoring: "true"
    {{- include "jobready.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: application
  ports:
    - name: http
      port: {{ .Values.application.port }}
      targetPort: {{ .Values.application.port }}
      protocol: TCP
    # Actuator (health + prometheus scrape) — never routed by the ingress.
    - name: management
      port: 8090
      targetPort: 8090
      protocol: TCP
