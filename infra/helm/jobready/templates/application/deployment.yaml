apiVersion: apps/v1
kind: Deployment
metadata:
  name: application
  namespace: {{ .Values.global.namespace }}
  labels:
    app: application
    {{- include "jobready.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.application.replicas | int }}
  selector:
    matchLabels:
      app: application
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: application
        monitoring: "true"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U $(POSTGRES_USER); do
                echo "Waiting for postgres..."
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_USER
      containers:
        - name: application
          image: {{ .Values.global.imageRegistry }}/{{ .Values.application.image }}:{{ .Values.application.tag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.application.port }}
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_DB
            # Schema-per-service: every service shares the one Postgres database and is
            # isolated by its own schema (the app sets hibernate.default_schema=application).
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/$(POSTGRES_DB)
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_PASSWORD
            # This service only verifies JWTs — it fetches auth's public JWK Set in-cluster.
            - name: AUTH_JWKS_URL
              value: http://auth:8080/api/v1/auth/.well-known/jwks.json
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
          resources:
            {{- toYaml .Values.application.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.application.port }}
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.application.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
