apiVersion: apps/v1
kind: Deployment
metadata:
  name: application
  namespace: {{ .Values.global.namespace }}
  labels:
    app: application
    {{- include "jobready.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.application.replicas | int }}
  selector:
    matchLabels:
      app: application
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Surge-free rollout: the prod namespace ResourceQuota is sized to the
      # steady-state footprint with no headroom, so a surge pod can't be
      # scheduled (FailedCreate: exceeded quota). Take the old pod down first,
      # then start the new one.
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: application
        monitoring: "true"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U $(POSTGRES_USER); do
                echo "Waiting for postgres..."
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_USER
          # Limits are MANDATORY: the prod namespace has a ResourceQuota on
          # limits.* and no LimitRange, so any container (incl. init) without
          # them gets the whole pod rejected.
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
      containers:
        - name: application
          image: {{ .Values.global.imageRegistry }}/{{ .Values.application.image }}:{{ .Values.application.tag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.application.port }}
          env:
            # Image tag surfaced as the app_info{version} metric for release correlation.
            - name: APP_VERSION
              value: "{{ .Values.application.tag }}"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_DB
            # Schema-per-service: every service shares the one Postgres database and is
            # isolated by its own schema (the app sets hibernate.default_schema=application).
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/$(POSTGRES_DB)
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_PASSWORD
            # This service only verifies JWTs — it fetches auth's public JWK Set in-cluster.
            - name: AUTH_JWKS_URL
              value: http://auth:8080/api/v1/auth/.well-known/jwks.json
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            {{- if .Values.internalServiceTokenSecret }}
            # Enables the static-token /internal/v1 API for the email pipeline.
            # Omit internalServiceTokenSecret to keep it disabled (fail-closed).
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internalServiceTokenSecret }}
                  key: INTERNAL_SERVICE_TOKEN
            {{- end }}
          resources:
            {{- toYaml .Values.application.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
