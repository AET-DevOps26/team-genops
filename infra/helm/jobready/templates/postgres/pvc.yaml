apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "jobready.labels" . | nindent 4 }}
  annotations:
    # Survive `helm uninstall` — deleting the database is an explicit, separate
    # decision (playbooks/destroy.yml -e wipe_data=true), never a side effect.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.postgres.storageClassName }}
  # Explicit StorageClass. Omit (set "") to use the cluster default.
  storageClassName: {{ .Values.postgres.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      # .Values.postgres.storage resolves to "5Gi" from values.yaml
      # You can override: helm install jobready . --set postgres.storage=20Gi
      storage: {{ .Values.postgres.storage }}
