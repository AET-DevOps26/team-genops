{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    app: gateway
    monitoring: "true"
    {{- include "jobready.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.port }}
      protocol: TCP
    # Actuator (health + prometheus scrape) — never routed by the ingress.
    - name: management
      port: 8090
      targetPort: 8090
      protocol: TCP
{{- end }}
