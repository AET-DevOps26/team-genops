apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: {{ .Values.global.namespace }}
  labels:
    app: auth
    {{- include "jobready.labels" . | nindent 4 }}
spec:
  # The | (pipe) in Go templates feeds the left value into the right function.
  # int converts the value to an integer (required by Kubernetes for replicas).
  replicas: {{ .Values.auth.replicas | int }}
  selector:
    matchLabels:
      app: auth
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: auth
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U $(POSTGRES_USER); do
                echo "Waiting for postgres..."
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_USER
          # Limits are MANDATORY: the prod namespace has a ResourceQuota on
          # limits.* and no LimitRange, so any container (incl. init) without
          # them gets the whole pod rejected.
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
      containers:
        - name: auth
          # Build the full image reference from values:
          # global.imageRegistry/auth.image:auth.tag
          image: {{ .Values.global.imageRegistry }}/{{ .Values.auth.image }}:{{ .Values.auth.tag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.auth.port }}
          env:
            - name: APP_VERSION
              value: "{{ .Values.auth.tag }}"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_DB
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/$(POSTGRES_DB)
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_PASSWORD
            # Server-side session store (split-token BFF).
            - name: REDIS_URL
              value: redis://redis:6379
            # CSRF origin allow-list: exactly the public origin the SPA is served
            # from. Derived from ingress.host so it can never drift per environment.
            - name: AUTH_ALLOWED_ORIGINS
              value: "https://{{ .Values.ingress.host }}"
            {{- if .Values.auth.jwtSecret }}
            # Stable RSA signing keys from a Secret. Without these auth generates
            # an ephemeral keypair at startup (tokens die on restart / per replica).
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.jwtSecret }}
                  key: JWT_PRIVATE_KEY
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.jwtSecret }}
                  key: JWT_PUBLIC_KEY
            {{- end }}
            # Secure cookies require HTTPS at the browser edge.
            - name: AUTH_COOKIE_SECURE
              value: {{ .Values.auth.cookieSecure | quote }}
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
          resources:
            {{- toYaml .Values.auth.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8090
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
