apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: {{ .Values.global.namespace }}
  labels:
    app: auth
    {{- include "jobready.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: auth
  ports:
    - name: http
      port: {{ .Values.auth.port }}
      targetPort: {{ .Values.auth.port }}
      protocol: TCP
