apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai
  namespace: {{ .Values.global.namespace }}
  labels:
    app: genai
    {{- include "jobready.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.genai.replicas | int }}
  selector:
    matchLabels:
      app: genai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: genai
        monitoring: "true"
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U $(POSTGRES_USER); do
                echo "Waiting for postgres..."
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_USER
          # Limits are MANDATORY: the prod namespace has a ResourceQuota on
          # limits.* and no LimitRange, so any container (incl. init) without
          # them gets the whole pod rejected.
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
      containers:
        - name: genai
          image: {{ .Values.global.imageRegistry }}/{{ .Values.genai.image }}:{{ .Values.genai.tag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.genai.port }}
          env:
            # Image tag surfaced as the app_info{version} metric for release correlation.
            - name: APP_VERSION
              value: "{{ .Values.genai.tag }}"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: AUTH_JWKS_URL
              value: "http://auth:{{ .Values.auth.port }}/api/v1/auth/.well-known/jwks.json"
            # Profile reads + generated-document writes go to the document service,
            # authenticated by forwarding the calling user's JWT.
            - name: DOCUMENT_SERVICE_URL
              value: "http://document:{{ .Values.document.port }}"
            # Job/company context for tailored documents, same JWT-forwarding pattern.
            - name: APPLICATION_SERVICE_URL
              value: "http://application:{{ .Values.application.port }}"
            - name: PROFILE_ENABLED
              value: "true"
            {{- if .Values.genai.openrouterSecret }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.genai.openrouterSecret }}
                  key: OPENROUTER_API_KEY
            {{- end }}
            {{- if .Values.genai.langfuseSecret }}
            # LLM observability. Point at Langfuse Cloud (or a self-hosted URL).
            # Omit genai.langfuseSecret to disable tracing — genai then no-ops.
            - name: LANGFUSE_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.genai.langfuseSecret }}
                  key: LANGFUSE_HOST
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.genai.langfuseSecret }}
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.genai.langfuseSecret }}
                  key: LANGFUSE_SECRET_KEY
            {{- end }}
          resources:
            {{- toYaml .Values.genai.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.genai.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.genai.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
