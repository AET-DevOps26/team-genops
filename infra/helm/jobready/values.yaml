global:
  # Target namespace for every resource. Override per environment.
  #   prod (TUM): ge86yog-devops-genops
  #   dev  (AKS): jobready (created by the chart)
  namespace: jobready

  # The container registry prefix. Every image name is:
  #   {{ .Values.global.imageRegistry }}/{{ .Values.someService.image }}:{{ .Values.someService.tag }}
  imageRegistry: ghcr.io/aet-devops26

  # imagePullPolicy for all services.
  # Use "IfNotPresent" locally to avoid re-pulling, "Always" in CI/CD.
  imagePullPolicy: Always

  # Names of existing dockerconfigjson Secrets used to pull PRIVATE GHCR images.
  # Create one with:
  #   kubectl create secret docker-registry ghcr-pull \
  #     --docker-server=ghcr.io --docker-username=<gh-user> \
  #     --docker-password=<PAT read:packages> -n <namespace>
  # Then list it here:
  #   imagePullSecrets:
  #     - name: ghcr-pull
  imagePullSecrets: []

namespace:
  # Whether THIS chart creates the Namespace object.
  # Set false when deploying into a pre-existing namespace, or when your
  # account cannot create namespaces (e.g. a TUM Rancher tenant namespace) —
  # in that case pass `helm --namespace <ns>` instead.
  create: false

postgres:
  image: pgvector/pgvector
  tag: pg16
  storage: 5Gi

  # StorageClass for the postgres PVC. "" uses the cluster default.
  #   TUM (Rancher): csi-rbd-sc     AKS: managed-csi (or "" for default)
  storageClassName: ""

  # Name of an existing Secret in the cluster that holds:
  #   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
  # Create it from your .env file before running helm install:
  #   kubectl create secret generic postgres-secret \
  #     --from-env-file=.env \
  #     -n <namespace>
  existingSecret: postgres-secret

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

redis:
  # Auth uses Redis for server-side sessions (split-token BFF). Required —
  # without it, auth's /actuator/health reports DOWN and the pod never gets Ready.
  enabled: true
  image: redis
  tag: 7-alpine

  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "128Mi"
      cpu: "100m"

auth:
  image: jobready-auth
  tag: latest
  replicas: 1
  port: 8080

  # Existing Secret holding the RSA signing keys:
  #   JWT_PRIVATE_KEY  (PKCS#8 PEM, -----BEGIN PRIVATE KEY-----)
  #   JWT_PUBLIC_KEY   (X.509 PEM,  -----BEGIN PUBLIC KEY-----)
  # If left blank, auth self-generates an EPHEMERAL keypair at startup —
  # tokens are invalidated on every restart and differ across replicas.
  # Set this for stable sessions / >1 replica.
  jwtSecret: auth-jwt

  # Session cookies use Secure=true → browsers only send them over HTTPS.
  # Keep "true" (both environments terminate TLS at the ingress).
  cookieSecure: "true"

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

application:
  image: jobready-application
  tag: latest
  replicas: 1
  port: 8080

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

document:
  image: jobready-document
  tag: latest
  replicas: 1
  port: 8080

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

genai:
  image: jobready-genai
  tag: latest
  replicas: 1
  port: 8000

  # Existing Secret holding the OpenRouter API key:
  #   OPENROUTER_API_KEY
  # If left blank, genai will fail to start (the key is required).
  openrouterSecret: genai-secrets

  # Optional Secret enabling Langfuse tracing (LLM observability). Leave blank to
  # disable — genai then runs without tracing (no-op). For the deployed env we
  # point at Langfuse Cloud rather than self-hosting the stateful stack.
  # The Secret must hold: LANGFUSE_HOST, LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY.
  # Create it from your Langfuse Cloud project keys:
  #   kubectl create secret generic genai-langfuse \
  #     --from-literal=LANGFUSE_HOST=https://cloud.langfuse.com \
  #     --from-literal=LANGFUSE_PUBLIC_KEY=pk-lf-... \
  #     --from-literal=LANGFUSE_SECRET_KEY=sk-lf-... \
  #     -n <namespace>
  langfuseSecret: ""

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

webClient:
  image: jobready-web-client
  tag: latest
  replicas: 1
  port: 80

  resources:
    requests:
      memory: "64Mi"
      cpu: "25m"
    limits:
      memory: "128Mi"
      cpu: "100m"

gateway:
  # In-cluster API gateway (Spring Cloud Gateway). When enabled, the Ingress
  # routes everything to the gateway, which fans out: /api/** -> auth, /** -> web-client.
  enabled: true
  image: jobready-gateway
  tag: latest
  replicas: 1
  port: 8081

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

ingress:
  enabled: true

  # The public hostname. Override per environment:
  #   prod: jobready.stud.k8s.aet.cit.tum.de
  #   dev:  jobready-dev.<region>.cloudapp.azure.com
  host: jobready.local

  # Must match an installed IngressController.
  #   TUM: confirm in Rancher UI    AKS: nginx (installed by Ansible)
  ingressClassName: nginx

  # cert-manager ClusterIssuer that auto-issues the TLS cert.
  # "" disables cert-manager automation (you must supply tls.secretName yourself).
  #   prod: the platform PRODUCTION issuer (NOT staging) — confirm the name
  #   dev:  the Ansible-installed Let's Encrypt issuer
  clusterIssuer: ""

  # Extra annotations merged onto the Ingress.
  annotations: {}

  tls:
    enabled: false           # set true once a host + issuer (or cert) is in place
    secretName: jobready-tls
