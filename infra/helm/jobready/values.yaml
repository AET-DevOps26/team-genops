global:
  # Target namespace for every resource. Override per environment.
  #   prod (TUM): ge86yog-devops-genops
  #   dev  (AKS): jobready (created by the chart)
  namespace: jobready

  # The container registry prefix. Every image name is:
  #   {{ .Values.global.imageRegistry }}/{{ .Values.someService.image }}:{{ .Values.someService.tag }}
  imageRegistry: ghcr.io/aet-devops26

  # imagePullPolicy for all services.
  # Use "IfNotPresent" locally to avoid re-pulling, "Always" in CI/CD.
  imagePullPolicy: Always

  # GHCR packages are currently PUBLIC, so no pull secret is configured anywhere.
  # If they ever go private again: names of existing dockerconfigjson Secrets.
  # Create one with:
  #   kubectl create secret docker-registry ghcr-pull \
  #     --docker-server=ghcr.io --docker-username=<gh-user> \
  #     --docker-password=<PAT read:packages> -n <namespace>
  # Then list it here:
  #   imagePullSecrets:
  #     - name: ghcr-pull
  imagePullSecrets: []

# Name of an existing Secret holding INTERNAL_SERVICE_TOKEN — the shared secret guarding
# the /internal/** service-to-service APIs (email → genai/application detection pipeline).
# Leave blank to keep the internal APIs disabled (they fail-closed without a token).
# Create it with:
#   kubectl create secret generic internal-service-token \
#     --from-literal=INTERNAL_SERVICE_TOKEN=$(openssl rand -hex 32) -n <namespace>
internalServiceTokenSecret: ""

namespace:
  # Whether THIS chart creates the Namespace object.
  # Set false when deploying into a pre-existing namespace, or when your
  # account cannot create namespaces (e.g. a TUM Rancher tenant namespace) —
  # in that case pass `helm --namespace <ns>` instead.
  create: false

postgres:
  image: pgvector/pgvector
  tag: pg16
  storage: 5Gi

  # StorageClass for the postgres PVC. "" uses the cluster default.
  #   TUM (Rancher): csi-rbd-sc     AKS: managed-csi (or "" for default)
  storageClassName: ""

  # Name of an existing Secret in the cluster that holds:
  #   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
  # Create it from your .env file before running helm install:
  #   kubectl create secret generic postgres-secret \
  #     --from-env-file=.env \
  #     -n <namespace>
  existingSecret: postgres-secret

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      # Right-sized 2026-07-19 (observed ~12m; no JVM startup burst): frees
      # 300m of the namespace limits-quota for the monitoring namespace split.
      cpu: "200m"

redis:
  # Auth uses Redis for server-side sessions (split-token BFF). Required —
  # without it, auth's /actuator/health reports DOWN and the pod never gets Ready.
  enabled: true
  image: redis
  tag: 7-alpine

  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "128Mi"
      cpu: "100m"

auth:
  image: jobready-auth
  tag: latest
  replicas: 1
  port: 8080


  # Secret holding JWT_PRIVATE_KEY + JWT_PUBLIC_KEY. REQUIRED — auth fails
  # fast at startup if the keys are blank (no self-generated fallback).
  # Generate values with scripts/gen-jwt-keys.sh.
  jwtSecret: auth-jwt

  # Session cookies use Secure=true → browsers only send them over HTTPS.
  cookieSecure: "true"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

application:
  image: jobready-application
  tag: latest
  replicas: 1
  port: 8080

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

document:
  image: jobready-document
  tag: latest
  replicas: 1
  port: 8080

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

email:
  # Off by default: the OAuth connect flow needs Google credentials in
  # email.existingSecret and the redirect URI registered per host in the
  # Google Cloud console. values-dev/prod turn it on.
  enabled: false
  image: jobready-email
  tag: latest
  # Single-instance by design (in-process Gmail poller + OAuth nonce store) —
  # do not scale up without adding a Redis leader lock first.
  replicas: 1
  port: 8080

  # Existing Secret holding the email service's secrets:
  #   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET  — Gmail OAuth client
  #   EMAIL_TOKEN_ENC_KEY                     — AES-GCM key for tokens at rest.
  #                                             ROTATING IT ORPHANS ALL STORED GMAIL
  #                                             TOKENS (users must reconnect).
  #   STATE_SIGNING_KEY                       — HMAC key for the OAuth state token
  # Created by Ansible deploy.yml from the vault (vault_google_client_id, ...).
  existingSecret: email-secrets

  # How often the background poller fetches new emails, in seconds.
  pollIntervalSeconds: 300

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

genai:
  image: jobready-genai
  tag: latest
  replicas: 1
  port: 8000

  # Existing Secret holding the OpenRouter API key:
  #   OPENROUTER_API_KEY
  # If left blank, genai will fail to start (the key is required).
  openrouterSecret: genai-secrets

  # Optional Secret enabling Langfuse tracing (LLM observability). Leave blank to
  # disable — genai then runs without tracing (no-op). For the deployed env we
  # point at Langfuse Cloud rather than self-hosting the stateful stack.
  # The Secret must hold: LANGFUSE_HOST, LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY.
  # Create it from your Langfuse Cloud project keys:
  #   kubectl create secret generic genai-langfuse \
  #     --from-literal=LANGFUSE_HOST=https://cloud.langfuse.com \
  #     --from-literal=LANGFUSE_PUBLIC_KEY=pk-lf-... \
  #     --from-literal=LANGFUSE_SECRET_KEY=sk-lf-... \
  #     -n <namespace>
  langfuseSecret: ""

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

webClient:
  image: jobready-web-client
  tag: latest
  replicas: 1
  port: 80

  resources:
    requests:
      memory: "64Mi"
      cpu: "25m"
    limits:
      memory: "128Mi"
      cpu: "100m"

gateway:
  # In-cluster API gateway (Spring Cloud Gateway). When enabled, the Ingress
  # routes everything to the gateway, which fans out: /api/** -> auth, /** -> web-client.
  enabled: true
  image: jobready-gateway
  tag: latest
  replicas: 1
  port: 8081

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

networkPolicy:
  # Default-deny + explicit allow-list for pod-to-pod traffic. OFF by default
  # (and in dev) so local/AKS bring-up is never blocked; turned ON in prod
  # (values-prod.yaml) for tenant isolation. Rollback if it misbehaves:
  #   helm upgrade ... --set networkPolicy.enabled=false
  enabled: false

  # Namespace where the ingress controller runs. Used to allow ingress→gateway
  # (default-deny blocks it otherwise). Must match the controller's namespace;
  # a wrong value silently blocks ALL external traffic to the gateway.
  #   AKS (Ansible-installed ingress-nginx): ingress-nginx
  #   TUM Rancher: confirm the platform controller's namespace before enabling.
  ingressNamespace: ingress-nginx

  # Optional node/pod CIDR allowed to reach pods for kubelet HTTP health probes.
  # Some CNIs (Calico/Canal) enforce NetworkPolicy on probe traffic, which
  # originates from the node IP — outside any pod/namespace selector — so a
  # default-deny can fail readiness and take the pod down. Leave "" if your CNI
  # exempts host→pod probes (e.g. Cilium); set to the node CIDR if it does not.
  probeCidr: ""

  # Namespace Prometheus scrapes from. When set, pods labelled monitoring: "true"
  # accept ingress from that namespace. "" = policy not rendered.
  #   prod (TUM): genops-monitoring
  monitoringNamespace: ""

ingress:
  enabled: true

  # The public hostname. Override per environment:
  #   prod: jobready.stud.k8s.aet.cit.tum.de
  #   dev:  jobready-dev.<region>.cloudapp.azure.com
  host: jobready.local

  # Must match an installed IngressController.
  # AKS: nginx (installed by Ansible)
  ingressClassName: nginx

  # cert-manager ClusterIssuer that auto-issues the TLS cert.
  # "" disables cert-manager automation (you must supply tls.secretName yourself).
  #   prod: the platform PRODUCTION issuer (NOT staging) — confirm the name
  #   dev:  the Ansible-installed Let's Encrypt issuer
  clusterIssuer: ""

  # Extra annotations merged onto the Ingress.
  annotations: {}

  tls:
    enabled: false           # set true once a host + issuer (or cert) is in place
    secretName: jobready-tls
