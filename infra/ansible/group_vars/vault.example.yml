# Secret values consumed by playbooks/deploy.yml.
#
# Copy this into each environment's inventory and ENCRYPT it:
#   cp group_vars/vault.example.yml inventories/dev/group_vars/vault.yml
#   ansible-vault encrypt inventories/dev/group_vars/vault.yml
#   (repeat for inventories/prod/group_vars/vault.yml)
#
# Never commit the unencrypted file. Generate the JWT keys with:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem
#   openssl rsa -in private.pem -pubout -out public.pem

vault_postgres_user: jobready
vault_postgres_password: change-me
vault_postgres_db: jobready

# Grafana admin login for the monitoring stack (playbooks/monitoring.yml
# creates the grafana-admin Secret from this; prod vault only).
vault_grafana_admin_password: xxxxxxxxxxxxxxxxxxxxxxx

# OpenRouter API key for the genai service (LLM calls).
vault_openrouter_api_key: sk-or-xxxxxxxxxxxxxxxxxxxx

# RSA signing keys — PKCS#8 private + X.509 public. Paste each PEM file's
# FULL contents, including its BEGIN/END header lines.
vault_jwt_private_key: |
  ...paste the full contents of private.pem here...
vault_jwt_public_key: |
  ...paste the full contents of public.pem here...
