# Secret values consumed by playbooks/deploy.yml.
#
# Copy this into each environment's inventory and ENCRYPT it:
#   cp group_vars/vault.example.yml inventories/dev/group_vars/vault.yml
#   ansible-vault encrypt inventories/dev/group_vars/vault.yml
#   (repeat for inventories/prod/group_vars/vault.yml)
#
# Never commit the unencrypted file. Generate the JWT keys with:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem
#   openssl rsa -in private.pem -pubout -out public.pem

vault_postgres_user: jobready
vault_postgres_password: change-me
vault_postgres_db: jobready

# OpenRouter API key for the genai service (LLM calls).
vault_openrouter_api_key: sk-or-xxxxxxxxxxxxxxxxxxxx

# RSA signing keys — PKCS#8 private (BEGIN PRIVATE KEY) + X.509 public (BEGIN PUBLIC KEY).
vault_jwt_private_key: |
  -----BEGIN PRIVATE KEY-----
  ...paste private.pem...
  -----END PRIVATE KEY-----
vault_jwt_public_key: |
  -----BEGIN PUBLIC KEY-----
  ...paste public.pem...
  -----END PUBLIC KEY-----

# --- Email service (Gmail integration) -------------------------------------
# All four must be set for the email service to deploy — deploy.yml derives
# email.enabled from their presence, so leaving them out simply keeps the
# service off. The OAuth client's redirect URI must ALSO be registered in the
# Google Cloud console for each host:
#   https://<ingress-host>/api/v1/email/connections/gmail/callback
vault_google_client_id: ""
vault_google_client_secret: ""
# AES-GCM key encrypting stored Gmail tokens. Generate: openssl rand -hex 32
# WARNING: rotating this orphans every stored token — users must reconnect.
vault_email_token_enc_key: ""
# HMAC key signing the short-lived OAuth state token. Generate: openssl rand -hex 32
vault_state_signing_key: ""

# Shared static token guarding the /internal/** service-to-service APIs
# (email → genai/application detection pipeline). Generate: openssl rand -hex 32
# Optional: leave empty to keep the internal APIs disabled (fail-closed).
vault_internal_service_token: ""
