env_name: prod

# Kubeconfig for the TUM Rancher cluster (context `stud`).
kubeconfig: "{{ lookup('ansible.builtin.env', 'KUBECONFIG') | default('~/.kube/config', true) }}"

namespace: ge86yog-devops-genops
create_namespace: false

# Prod (TUM) already provides ingress-nginx + cert-manager — do NOT install them.
install_platform: false

release_name: jobready
chart_path: "{{ playbook_dir }}/../../helm/jobready"
values_file: "{{ chart_path }}/values-prod.yaml"
image_tag: "latest"                    # override: -e image_tag=sha-<short>
ingress_host: ""                       # empty → ingress.host comes from values-prod.yaml

# Monitoring stack (playbooks/monitoring.yml) — prod/TUM only. Absent from the
# dev inventory on purpose: dev/AKS runs no monitoring; local uses compose.
monitoring_namespace: genops-monitoring
monitoring_chart_path: "{{ playbook_dir }}/../../helm/monitoring"
grafana_url: "https://genops-grafana.stud.k8s.aet.cit.tum.de"
