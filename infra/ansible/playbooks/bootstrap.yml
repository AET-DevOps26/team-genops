# Installs cluster platform add-ons. Only does work where install_platform=true
# (dev/AKS). On prod/TUM these are provided by the platform, so this is a no-op.
- name: Bootstrap cluster platform (ingress-nginx + cert-manager)
  hosts: all
  gather_facts: false
  tasks:
    - name: Add Helm repositories
      kubernetes.core.helm_repository:
        name: "{{ item.name }}"
        repo_url: "{{ item.url }}"
      loop:
        - { name: ingress-nginx, url: "https://kubernetes.github.io/ingress-nginx" }
        - { name: jetstack, url: "https://charts.jetstack.io" }
      when: install_platform | bool

    - name: Install ingress-nginx bound to the reserved static IP
      kubernetes.core.helm:
        name: ingress-nginx
        chart_ref: ingress-nginx/ingress-nginx
        release_namespace: ingress-nginx
        create_namespace: true
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        values:
          controller:
            service:
              loadBalancerIP: "{{ ingress_ip }}"
              annotations:
                service.beta.kubernetes.io/azure-load-balancer-resource-group: "{{ azure_lb_resource_group }}"
                # The service ports carry appProtocol=http/https, so Azure builds an HTTP
                # health probe. Its default path is "/", which ingress-nginx answers with
                # 404 -> Azure marks every node unhealthy -> the LB black-holes all traffic.
                # Point the probe at /healthz (ingress-nginx returns 200 there) so backends
                # stay healthy. Without this the site hangs and ACME HTTP-01 never completes.
                service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
      when: install_platform | bool

    - name: Install cert-manager (with CRDs)
      kubernetes.core.helm:
        name: cert-manager
        chart_ref: jetstack/cert-manager
        release_namespace: cert-manager
        create_namespace: true
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        values:
          crds:
            enabled: true
      when: install_platform | bool

    - name: Create Let's Encrypt production ClusterIssuer (HTTP-01 via ingress-nginx)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-prod
          spec:
            acme:
              server: https://acme-v02.api.letsencrypt.org/directory
              email: "{{ acme_email }}"
              privateKeySecretRef:
                name: letsencrypt-prod-account-key
              solvers:
                - http01:
                    ingress:
                      class: nginx
      when: install_platform | bool
