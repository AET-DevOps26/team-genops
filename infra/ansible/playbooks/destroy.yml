# Tears JobReady out of the target namespace for a clean redeploy.
# Removes the Helm release AND the secrets deploy.yml creates outside the chart.
# When the inventory defines monitoring_namespace (prod), the monitoring
# release + its pipeline-created secret are removed too — both stacks are
# fully rebuilt by cd-prod / cd-monitoring afterwards, no manual steps.
# Does NOT delete the namespaces (the prod tenant cannot), and keeps TLS
# secrets by default — Let's Encrypt rate-limits issuance (5/week per domain),
# so a still-valid cert is worth preserving across rebuilds. Prometheus's
# metrics PVC is likewise kept unless wipe_data=true.
#
# Usage (the confirm gate must match the target namespace exactly):
#   ansible-playbook -i inventories/prod/hosts.yml playbooks/destroy.yml \
#     -e destroy_confirm=ge86yog-devops-genops [-e wipe_data=true] [-e wipe_tls=true]
- name: Destroy JobReady
  hosts: all
  gather_facts: false
  vars:
    wipe_data: false   # true → also delete PVCs (postgres data is GONE)
    wipe_tls: false    # true → also delete the TLS secret (forces cert re-issue)
  tasks:
    - name: Refuse to run without explicit confirmation
      ansible.builtin.assert:
        that:
          - destroy_confirm is defined
          - destroy_confirm == namespace
        fail_msg: >-
          Pass -e destroy_confirm={{ namespace }} to confirm you are destroying
          the '{{ env_name }}' environment in namespace '{{ namespace }}'.

    - name: Uninstall the Helm release
      kubernetes.core.helm:
        name: "{{ release_name }}"
        release_namespace: "{{ namespace }}"
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        wait: true

    # deploy.yml creates these outside the chart; helm uninstall never touches them.
    - name: Delete deploy-created secrets
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: v1
        kind: Secret
        namespace: "{{ namespace }}"
        name: "{{ item }}"
      loop:
        - postgres-secret
        - auth-jwt
        - genai-secrets
        - ghcr-pull          # legacy (images are public now); absent is fine

    # Hand-created hotfix objects that predate their chart-managed versions.
    # Deleting them lets the next helm install own its resources cleanly instead
    # of failing adoption ("invalid ownership metadata").
    - name: Delete hand-created leftovers
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: networking.k8s.io/v1
        kind: NetworkPolicy
        namespace: "{{ namespace }}"
        name: allow-acme-solver

    - name: Delete PVCs (data is unrecoverable)
      when: wipe_data | bool
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: "{{ namespace }}"
        name: postgres-pvc

    - name: Delete TLS secret (forces Let's Encrypt re-issue — rate limited!)
      when: wipe_tls | bool
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: v1
        kind: Secret
        namespace: "{{ namespace }}"
        name: jobready-tls

    # ------------------------------------------------------------------
    # Monitoring stack (prod only — dev defines no monitoring_namespace)
    # ------------------------------------------------------------------

    - name: Uninstall the monitoring Helm release
      when: (monitoring_namespace | default('') | length) > 0
      kubernetes.core.helm:
        name: monitoring
        release_namespace: "{{ monitoring_namespace }}"
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        wait: true

    # monitoring.yml recreates this from the vault on the next deploy.
    - name: Delete pipeline-created grafana-admin secret
      when: (monitoring_namespace | default('') | length) > 0
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: v1
        kind: Secret
        namespace: "{{ monitoring_namespace }}"
        name: grafana-admin

    # Deleting the StatefulSet only orphans its PVC — without this, a reinstall
    # reattaches to the old metrics history (which is normally what you want).
    - name: Delete Prometheus metrics PVC (history is unrecoverable)
      when: wipe_data | bool and (monitoring_namespace | default('') | length) > 0
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: "{{ monitoring_namespace }}"
        name: prometheus-jobready-db-prometheus-jobready-0

    - name: Delete Grafana TLS secret (forces Let's Encrypt re-issue — rate limited!)
      when: wipe_tls | bool and (monitoring_namespace | default('') | length) > 0
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: v1
        kind: Secret
        namespace: "{{ monitoring_namespace }}"
        name: grafana-tls

    - name: Show what remains in the namespace
      ansible.builtin.command:
        cmd: kubectl --kubeconfig {{ kubeconfig }} -n {{ namespace }} get all,ingress,netpol,pvc,secret
      changed_when: false
      failed_when: false
      register: _remaining

    - name: Remaining resources
      ansible.builtin.debug:
        var: _remaining.stdout_lines

    - name: Show what remains in the monitoring namespace
      when: (monitoring_namespace | default('') | length) > 0
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ kubeconfig }} -n {{ monitoring_namespace }}
          get all,ingress,netpol,pvc,secret,prometheus,servicemonitor,prometheusrule
      changed_when: false
      failed_when: false
      register: _remaining_monitoring

    - name: Remaining monitoring resources
      when: (monitoring_namespace | default('') | length) > 0
      ansible.builtin.debug:
        var: _remaining_monitoring.stdout_lines
