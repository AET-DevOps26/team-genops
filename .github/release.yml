changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix

  categories:
    - title: Features
      labels:
        - feature
        - enhancement

    - title: Fixes
      labels:
        - fix
        - bug

    - title: Monitoring & Observability
      labels:
        - monitoring

    - title: Infrastructure & CI
      labels:
        - infra
        - github_actions

    - title: Documentation
      labels:
        - documentation

    - title: Dependencies
      labels:
        - dependencies

    - title: Other changes
      labels:
        - "*"
