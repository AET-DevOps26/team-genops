name: CI - Auth

on:
  pull_request:
    branches:
      - main

jobs:
  auth-ci:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobready
          POSTGRES_PASSWORD: jobready
          POSTGRES_DB: jobready
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('services/auth/pom.xml') }}
          restore-keys: maven-

      - name: Build and test
        run: ./mvnw verify
        working-directory: services/auth
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/jobready
          SPRING_DATASOURCE_USERNAME: jobready
          SPRING_DATASOURCE_PASSWORD: jobready
