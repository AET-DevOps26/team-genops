name: CD - Dev (AKS)

# Runs after images are published to GHCR on main. Ensures the AKS infra exists
# (Terraform), then bootstraps the cluster and deploys the app (Ansible).
on:
  workflow_run:
    workflows: ["Build & Push Images"]
    types: [completed]
    branches: [main]
  push:
    branches: [PROJ-IE/fix-and-setup-infrastructure]   # TEMP: test branch — revert
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to latest, which build-images.yml always publishes from main)"
        required: false
        default: latest

permissions:
  contents: read
  id-token: write   # Azure OIDC login

# One dev operation at a time: a second trigger QUEUES until the running one
# finishes (never cancelled). Shared group with cluster-dev so a stop/start
# can't fire mid-deploy. Also prevents parallel `terraform apply` → no more
# stale state-lock incidents from overlapping runs.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # A stopped AKS cluster rejects EVERY operation except start (Terraform
      # apply included), and the nightly cost cron stops it at 22:00 UTC — so
      # any deploy must wake the cluster first. Absent is fine: Terraform
      # creates it on first run. `start` on a running cluster is a no-op.
      - name: Wake cluster if stopped
        env:
          SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RG: ${{ secrets.DEV_CLUSTER_RG }}
          CLUSTER: ${{ secrets.DEV_CLUSTER_NAME }}
        run: |
          if az aks show -g "$RG" -n "$CLUSTER" --subscription "$SUBSCRIPTION" -o none 2>/dev/null; then
            ./scripts/cluster.sh start
          else
            echo "Cluster does not exist yet — Terraform will create it."
          fi

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform apply
        working-directory: infra/terraform
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=dev.tfstate"
          terraform apply -auto-approve

      - name: Export Terraform outputs
        id: tf
        working-directory: infra/terraform
        run: |
          echo "ingress_ip=$(terraform output -raw ingress_ip)" >> "$GITHUB_OUTPUT"
          echo "fqdn=$(terraform output -raw ingress_fqdn)" >> "$GITHUB_OUTPUT"
          echo "rg=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          terraform output -raw kube_config > "$RUNNER_TEMP/kubeconfig"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Ansible + collections
        run: |
          pip install ansible-core kubernetes
          ansible-galaxy collection install -r infra/ansible/requirements.yml

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Bootstrap + deploy
        working-directory: infra/ansible
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          trap 'rm -f vault-pass' EXIT
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD_DEV }}" > vault-pass
          if [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            IMAGE_TAG="sha-$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)"
          elif [ "${{ github.event_name }}" = "push" ]; then
            IMAGE_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"   # TEMP: test branch — revert
          else
            IMAGE_TAG="${{ inputs.image_tag }}"
          fi
          ansible-playbook -i inventories/dev/hosts.yml playbooks/bootstrap.yml \
            --vault-password-file vault-pass \
            -e ingress_ip=${{ steps.tf.outputs.ingress_ip }} \
            -e azure_lb_resource_group=${{ steps.tf.outputs.rg }}
          ansible-playbook -i inventories/dev/hosts.yml playbooks/deploy.yml \
            --vault-password-file vault-pass \
            -e image_tag=${IMAGE_TAG} \
            -e ingress_host=${{ steps.tf.outputs.fqdn }}
