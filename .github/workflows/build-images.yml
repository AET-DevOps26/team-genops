name: Build & Push Images

# Publishes container images to GHCR on merge to main and on version tags.
# Pull-request CI (build + test) stays in the per-service ci-*.yml workflows.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR requires a lowercase owner; the repo lives under AET-DevOps26.
  IMAGE_PREFIX: ghcr.io/aet-devops26

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: services/auth
            image: jobready-auth
          - context: services/application
            image: jobready-application
          - context: services/document
            image: jobready-document
          - context: web-client
            image: jobready-web-client
          - context: services/gateway
            image: jobready-gateway
          - context: services/genai
            image: jobready-genai

    steps:
      - uses: actions/checkout@v7

      # The default docker driver can't export the git GitHub Actions cache; 
      # the container driver from Buildx can.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          # SHA tag (sha-<short>) for precise CD pins, latest on default branch,
          # semver tags on v* releases.
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
