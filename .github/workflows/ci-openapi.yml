name: CI - OpenAPI Lint

on:
  pull_request:
    branches:
      - main

jobs:
  openapi-lint:
    name: Lint OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint OpenAPI spec
        run: make -C api lint
