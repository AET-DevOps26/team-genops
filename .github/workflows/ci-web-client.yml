name: CI - Web Client

on:
  pull_request:
    branches:
      - main

jobs:
  web-client-ci:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web-client

      - name: Build
        run: npm run build
        working-directory: web-client
