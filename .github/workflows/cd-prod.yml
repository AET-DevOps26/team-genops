name: CD - Prod (Rancher)

# Deploys to the TUM Rancher namespace.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        # No default on purpose: prod must never accidentally ship the mutable
        # `latest` tag (repointed by every merge to main). Type it deliberately
        # if that is really what you want.
        description: "Exact image tag to deploy (e.g. 1.4.2 or sha-abc1234)"
        required: true

permissions:
  contents: read

# One prod operation at a time: a second trigger QUEUES until the running one
# finishes (never cancelled). Shared group with destroy-prod so a teardown can
# never overlap a release deploy.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - uses: actions/checkout@v7

      - name: Write Rancher kubeconfig
        run: echo "${{ secrets.RANCHER_KUBECONFIG }}" > "$RUNNER_TEMP/kubeconfig"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Ansible + collections
        run: |
          pip install ansible-core kubernetes
          ansible-galaxy collection install -r infra/ansible/requirements.yml

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

        # Remove leading 'v' from image semver tags (v1.2.3 -> 1.2.3)
      - name: Deploy to prod
        working-directory: infra/ansible
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          IMAGE_TAG: ${{ github.event.inputs.image_tag || github.event.release.tag_name }}
        run: |
          trap 'rm -f vault-pass' EXIT
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD_PROD }}" > vault-pass
          TAG="${IMAGE_TAG:-latest}"; TAG="${TAG#v}"
          ansible-playbook -i inventories/prod/hosts.yml playbooks/deploy.yml \
            --vault-password-file vault-pass \
            -e image_tag="$TAG"
