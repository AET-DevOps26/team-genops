openapi: 3.1.0
info:
  title: JobReady API
  version: 1.0.0
  description: |
    JobReady is an AI-powered job application tracker that helps candidates manage their job search end-to-end.

    Core capabilities:
    - Auth & Profiles — JWT-based registration/login; structured candidate profiles (experience, education, skills, certifications, languages).
    - Application Tracking — create applications by pasting a job description; manage status transitions (Applied → Interviewing → Offer → Rejected); auto-link incoming emails to the correct application.
    - Gmail Integration — connect/disconnect Gmail accounts; fetch and store application-related emails; surface follow-up recommendations for stale applications.
    - AI Features — tailored cover letter generation, candidate-role fit analysis with gap identification, and email-based insights — all driven by the candidate profile and target job description.
    - Document Management — store and retrieve AI-generated cover letters and fit analyses.
  contact:
    name: JobReady Support

servers:
  - url: http://localhost:8080
    description: Local development (API Gateway)
  - url: https://api.jobready.com
    description: Production

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Authentication and session management
  - name: Email
    description: Gmail integration — connect/disconnect accounts and read fetched emails
  - name: Applications
    description: Job application tracking — create applications, store job descriptions, and manage status transitions
  - name: Chat
    description: AI career-assistant chat — sessions and messages
  - name: Documents
    description: Candidate profile (experience, education, skills, languages) and AI-generated documents (cover letters, resumes)

paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: |
        Creates a new account and signs the user in immediately — no separate login step.
        Access and refresh tokens are delivered as HttpOnly cookies (never in the body);
        the response body carries the authenticated user's profile.
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; session cookies set
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error (e.g. password too short)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      description: |
        Verifies credentials and sets HttpOnly access + refresh cookies.
        Tokens are never returned in the body; the body carries the user's profile.
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful; session cookies set
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: |
        Reads the refresh token from the `jr_refresh` HttpOnly cookie, rotates it,
        and sets a fresh access + refresh cookie pair. The old refresh token is
        immediately invalidated. No request body — the cookie carries the token.
      security: []
      operationId: refreshToken
      responses:
        '204':
          description: New session cookies set
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
        '401':
          description: Refresh cookie missing, invalid, expired, or already rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout and invalidate the session
      description: |
        Revokes the refresh token read from the `jr_refresh` cookie and clears both
        session cookies (`jr_access`, `jr_refresh`). No request body.
      operationId: logout
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '204':
          description: Logged out; session cookies cleared
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedCookies'
        '401':
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current user info
      description: |
        Returns the authenticated user's profile, resolved from the JWT `sub` claim.
        The access token is taken from the `jr_access` cookie (or, behind the gateway,
        the translated `Authorization: Bearer` header).
      operationId: getMe
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/email/connections/gmail/authorize:
    post:
      tags: [Email]
      summary: Start the Gmail OAuth2 consent flow
      description: |
        Returns a Google consent URL the client should redirect the user to. The URL carries a
        signed, short-lived `state` token bound to the authenticated user (`sub` claim) and a
        single-use nonce; the callback verifies it to prevent CSRF/replay and account-binding attacks.
      operationId: authorizeGmail
      responses:
        '200':
          description: Consent URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GmailAuthorizeResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/chat/sessions:
    get:
      tags: [Chat]
      summary: List chat sessions
      description: List all sessions for the authenticated user, newest first.
      operationId: listChatSessions
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Sessions retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          description: Missing or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Chat]
      summary: Create a chat session
      description: Creates a new chat session for the authenticated user.
      operationId: createChatSession
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Missing or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error (e.g. invalid session_type)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/email/connections/gmail/callback:
    get:
      tags: [Email]
      summary: Gmail OAuth2 redirect callback
      description: |
        Google redirects here with `code` and `state`. The service verifies the `state` signature
        and nonce (rejecting forged/expired/replayed values), derives the user from the verified
        payload, exchanges the code for tokens, stores the connection, and redirects the browser
        back to the frontend. This endpoint is reached by the browser, not called service-to-service,
        so it is unauthenticated — the signed `state` is the trust anchor.
      operationId: gmailOAuthCallback
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Connection stored; browser redirected back to the frontend
          headers:
            Location:
              description: Frontend URL the user is returned to
              schema:
                type: string
        '400':
          description: Missing/invalid code or state, or token exchange failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/email/connections:
    get:
      tags: [Email]
      summary: Get the current user's email connection status
      operationId: getEmailConnection
      responses:
        '200':
          description: Connection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailConnectionStatus'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Email]
      summary: Disconnect the current user's email account
      description: Deletes the stored OAuth connection for the authenticated user.
      operationId: deleteEmailConnection
      responses:
        '204':
          description: Connection deleted (idempotent — 204 even if none existed)
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/chat/sessions/{session_id}:
    delete:
      tags: [Chat]
      summary: Delete a chat session
      description: Deletes a session and all its messages via cascade. Returns 404 if not found or not owned by the user.
      operationId: deleteChatSession
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Session and all its messages deleted
        '401':
          description: Missing or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session not found or not owned by user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/email/messages:
    get:
      tags: [Email]
      summary: List stored emails for the current user
      description: Returns the emails fetched by the background poller for the authenticated user, newest first.
      operationId: listEmailMessages
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Stored emails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailMessageList'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/applications:
    post:
      tags: [Applications]
      summary: Create a job application
      description: |
        Creates a job application for the authenticated user. The owner is resolved from the
        JWT `sub` claim — `user_id` is never accepted from the request body. New applications
        start in the `applied` stage.
      operationId: createApplication
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplication'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Applications]
      summary: List the current user's job applications
      description: |
        Returns the authenticated user's applications, newest first. Optionally filtered by
        stage and paginated; `total` always reflects the full filtered count.
      operationId: listApplications
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: stage
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ApplicationStage'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: The user's applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationList'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/applications/summary:
    get:
      tags: [Applications]
      summary: Per-stage application counts
      description: |
        Returns how many of the authenticated user's applications are in each stage, plus the
        total — lets the dashboard render its pipeline without fetching every row.
      operationId: getApplicationSummary
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Stage counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSummary'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/applications/{id}/recommendations:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Applications]
      summary: List recommendations for an application
      description: |
        Returns stored next-best-action recommendations for one application owned by the
        authenticated user, newest first.
      operationId: listRecommendations
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: The application's recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationList'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such application for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Applications]
      summary: Add a recommendation to an application
      description: |
        Stores a next-best-action recommendation on an application owned by the authenticated
        user. Persistence only — generating recommendations is out of scope for this service.
      operationId: createRecommendation
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecommendationRequest'
      responses:
        '201':
          description: Recommendation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendation'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such application for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/applications/{id}/recommendations/{recommendationId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: recommendationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Applications]
      summary: Delete a recommendation
      description: Deletes one recommendation from an application owned by the authenticated user.
      operationId: deleteRecommendation
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '204':
          description: Recommendation deleted
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such application or recommendation for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/applications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Applications]
      summary: Get a single job application
      description: Returns one application owned by the authenticated user.
      operationId: getApplication
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: The application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplication'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such application for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Applications]
      summary: Update a job application
      description: |
        Updates an application owned by the authenticated user, including stage transitions
        (`applied` → `follow_up` → `interview` → `offer` → `closed`).
      operationId: updateApplication
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
      responses:
        '200':
          description: Updated application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplication'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such application for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Applications]
      summary: Delete a job application
      description: Deletes an application owned by the authenticated user.
      operationId: deleteApplication
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '204':
          description: Application deleted
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such application for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/profile:
    get:
      tags: [Documents]
      summary: Get the current user's full profile
      description: |
        Returns the authenticated user's profile basics together with all sub-resources
        (work experiences, educations, skills, languages) in one aggregate. Returns 404
        when the user has not created a profile yet — clients use this to detect that
        onboarding is still needed.
      operationId: getProfile
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: The user's aggregated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAggregateResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No profile exists for this user yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Documents]
      summary: Create or update the current user's profile basics
      description: |
        Upserts the profile basics keyed on the JWT `sub` — creates the profile on first
        call, updates it afterwards. Sub-resources are managed via their own endpoints.
      operationId: upsertProfile
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200':
          description: The saved profile basics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/profile/work-experiences:
    post:
      tags: [Documents]
      summary: Add a work experience
      description: |
        Adds a work experience to the authenticated user's profile. The profile basics
        must exist first (404 otherwise). Reads happen via the profile aggregate.
      operationId: createWorkExperience
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkExperienceRequest'
      responses:
        '201':
          description: Work experience created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkExperience'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No profile exists for this user yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/profile/work-experiences/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Documents]
      summary: Update a work experience
      operationId: updateWorkExperience
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkExperienceRequest'
      responses:
        '200':
          description: Updated work experience
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkExperience'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such work experience for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Documents]
      summary: Delete a work experience
      operationId: deleteWorkExperience
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '204':
          description: Work experience deleted
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such work experience for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/profile/educations:
    post:
      tags: [Documents]
      summary: Add an education entry
      description: |
        Adds an education entry to the authenticated user's profile. The profile basics
        must exist first (404 otherwise). Reads happen via the profile aggregate.
      operationId: createEducation
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EducationRequest'
      responses:
        '201':
          description: Education entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Education'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No profile exists for this user yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/profile/educations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Documents]
      summary: Update an education entry
      operationId: updateEducation
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EducationRequest'
      responses:
        '200':
          description: Updated education entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Education'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such education entry for this user
          content:
