  /api/v1/chat/sessions/{session_id}/messages:
    get:
      tags: [Chat]
      summary: List session messages
      description: Returns all messages for a session oldest-first. Verifies ownership.
      operationId: listSessionMessages
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Messages retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '401':
          description: Missing or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session not found or not owned by user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Chat]
      summary: Send a message
      description: |
        Sends a message to the AI career assistant and returns the response.
        Conversation summarization runs in the background — the caller never waits for it.
      operationId: sendMessage
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '200':
          description: AI response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Missing or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session not found or not owned by user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error (e.g. message exceeds 8000 chars)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: jr_access
      description: |
        HttpOnly access-token cookie set by the auth service on login/register.
        Used directly by the auth service; the gateway translates it into an
        `Authorization: Bearer` header for downstream services.

  headers:
    SessionCookies:
      description: |
        Two HttpOnly cookies are set:
        `jr_access` (the access JWT, Path=/, Max-Age, HttpOnly; Secure; SameSite=Strict)
        and `jr_refresh` (the rotating refresh token, Path=/api/v1/auth,
        Max-Age, HttpOnly; Secure; SameSite=Strict).
      schema:
        type: string
      example: jr_access=<jwt>; Path=/; Max-Age=900; HttpOnly; Secure; SameSite=Strict
    ClearedCookies:
      description: Both session cookies are expired (Max-Age=0).
      schema:
        type: string
      example: jr_access=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Strict

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: jane@example.com
        password:
          type: string
          format: password
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: jane@example.com
        password:
          type: string
          format: password
          minLength: 8

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Stable user identifier — matches JWT `sub` claim
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INVALID_CREDENTIALS
        message:
          type: string
          example: Email or password is incorrect
        details:
          type: object
          additionalProperties: true
          description: Optional field-level validation errors or additional context

    GmailAuthorizeResponse:
      type: object
      required: [authorization_url]
      properties:
        authorization_url:
          type: string
          format: uri
          description: Google consent URL the client should redirect the user to
          example: https://accounts.google.com/o/oauth2/v2/auth?client_id=...&state=...

    EmailConnectionStatus:
      type: object
      required: [connected]
      properties:
        connected:
          type: boolean
          description: Whether the user has a stored email connection
        provider:
          type: string
          enum: [gmail]
          description: Present only when connected
        email_address:
          type: string
          format: email
          description: The connected mailbox address — present only when connected
        connected_at:
          type: string
          format: date-time
          description: When the connection was first established — present only when connected

    EmailMessage:
      type: object
      required: [message_id]
      properties:
        message_id:
          type: string
          description: Provider-side unique message identifier
        subject:
          type: [string, 'null']
        sender:
          type: [string, 'null']
        snippet:
          type: [string, 'null']
        received_at:
          type: [string, 'null']
          format: date-time

    EmailMessageList:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/EmailMessage'
        limit:
          type: integer
        offset:
          type: integer

    ApplicationStage:
      type: string
      enum: [applied, follow_up, interview, offer, closed]
      description: |
        Application lifecycle stage: `applied` → `follow_up` → `interview` → `offer` → `closed`.

    JobApplication:
      type: object
      required: [id, company, job_title, stage, applied_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        company:
          type: string
        job_title:
          type: string
        job_description:
          type: [string, 'null']
          description: Free-text job description pasted by the user
        job_url:
          type: [string, 'null']
        company_website:
          type: [string, 'null']
        linkedin_url:
          type: [string, 'null']
        stage:
          $ref: '#/components/schemas/ApplicationStage'
        notes:
          type: [string, 'null']
        applied_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateApplicationRequest:
      type: object
      required: [company, job_title]
      properties:
        company:
          type: string
          minLength: 1
          maxLength: 255
        job_title:
          type: string
          minLength: 1
          maxLength: 255
        job_description:
          type: string
        job_url:
          type: string
          maxLength: 512
        company_website:
          type: string
          maxLength: 512
        linkedin_url:
          type: string
          maxLength: 512
        notes:
          type: string

    UpdateApplicationRequest:
      type: object
      required: [company, job_title, stage]
      properties:
        company:
          type: string
          minLength: 1
          maxLength: 255
        job_title:
          type: string
          minLength: 1
          maxLength: 255
        job_description:
          type: string
        job_url:
          type: string
          maxLength: 512
        company_website:
          type: string
          maxLength: 512
        linkedin_url:
          type: string
          maxLength: 512
        stage:
          $ref: '#/components/schemas/ApplicationStage'
        notes:
          type: string

    ApplicationList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobApplication'
        total:
          type: integer
          format: int64
          description: Total matching applications (across all pages, after stage filtering)

    ApplicationSummary:
      type: object
      required: [applied, follow_up, interview, offer, closed, total]
      properties:
        applied:
          type: integer
          format: int64
        follow_up:
          type: integer
          format: int64
        interview:
          type: integer
          format: int64
        offer:
          type: integer
          format: int64
        closed:
          type: integer
          format: int64
        total:
          type: integer
          format: int64

    Recommendation:
      type: object
      required: [id, application_id, insight, recommended_action, created_at]
      properties:
        id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
        insight:
          type: string
          description: The observation the recommendation is based on
        recommended_action:
          type: string
          description: The suggested next best action
        created_at:
          type: string
          format: date-time

    CreateRecommendationRequest:
      type: object
      required: [insight, recommended_action]
      properties:
        insight:
          type: string
          minLength: 1
        recommended_action:
          type: string
          minLength: 1

    RecommendationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Recommendation'

    # ---------------------------------------------------------------------------
    # Documents — candidate profile & generated documents
    # ---------------------------------------------------------------------------

    Profile:
      type: object
      required: [id, first_name, last_name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        bio:
          type: [string, 'null']
          description: Free-text professional summary
        location:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        website:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProfileRequest:
      type: object
      required: [first_name, last_name]
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        bio:
          type: string
        location:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 50
        website:
          type: string
          maxLength: 255

    ProfileAggregateResponse:
      type: object
      required: [profile, work_experiences, educations, skills, languages]
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
        work_experiences:
          type: array
          items:
            $ref: '#/components/schemas/WorkExperience'
        educations:
          type: array
          items:
            $ref: '#/components/schemas/Education'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
        languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'

    WorkExperience:
      type: object
      required: [id, company, role, start_date, is_current, created_at]
      properties:
        id:
          type: string
          format: uuid
        company:
          type: string
        role:
          type: string
        location:
          type: [string, 'null']
        start_date:
          type: string
          format: date
        end_date:
          type: [string, 'null']
          format: date
          description: Null while `is_current` is true
        is_current:
          type: boolean
        description:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time

    WorkExperienceRequest:
      type: object
      required: [company, role, start_date]
      properties:
        company:
          type: string
          minLength: 1
          maxLength: 255
        role:
          type: string
          minLength: 1
          maxLength: 255
        location:
          type: string
          maxLength: 255
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
          default: false
        description:
          type: string

    Education:
      type: object
      required: [id, institution, degree, start_date, created_at]
      properties:
        id:
          type: string
          format: uuid
        institution:
          type: string
        degree:
          type: string
        field:
          type: [string, 'null']
        start_date:
          type: string
          format: date
        end_date:
          type: [string, 'null']
          format: date
        description:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time

    EducationRequest:
      type: object
      required: [institution, degree, start_date]
      properties:
        institution:
          type: string
          minLength: 1
          maxLength: 255
        degree:
          type: string
          minLength: 1
          maxLength: 255
        field:
          type: string
          maxLength: 255
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        description:
          type: string

    SkillLevel:
      type: string
      enum: [beginner, intermediate, advanced, expert]
      description: Lowercase wire values — persisted verbatim (DB CHECK constraint matches).

    Skill:
      type: object
      required: [id, name, level, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        level:
          $ref: '#/components/schemas/SkillLevel'
        created_at:
          type: string
          format: date-time

    SkillRequest:
      type: object
      required: [name, level]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        level:
          $ref: '#/components/schemas/SkillLevel'

    LanguageProficiency:
      type: string
      enum: [basic, conversational, fluent, native]
      description: Lowercase wire values — persisted verbatim (DB CHECK constraint matches).

    Language:
      type: object
      required: [id, name, proficiency, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        proficiency:
          $ref: '#/components/schemas/LanguageProficiency'
        created_at:
          type: string
          format: date-time

    LanguageRequest:
      type: object
      required: [name, proficiency]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        proficiency:
          $ref: '#/components/schemas/LanguageProficiency'

    GeneratedDocumentType:
      type: string
      enum: [cover_letter, resume]

    GeneratedDocument:
      type: object
      required: [id, type, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        application_id:
          type: ['string', 'null']
          format: uuid
          description: >-
            The application this document was tailored for (no cross-service FK), or null for a
            standalone document — a user may polish a general resume without a target job.
            A document is owned by its user; being filed under an application is optional.
        type:
          $ref: '#/components/schemas/GeneratedDocumentType'
        content:
          type: string
        created_at:
          type: string
          format: date-time

    CreateGeneratedDocumentRequest:
      type: object
      required: [type, content]
      properties:
        application_id:
          type: ['string', 'null']
          format: uuid
          description: Omit to save a standalone document not tied to any application.
        type:
          $ref: '#/components/schemas/GeneratedDocumentType'
        content:
          type: string
          minLength: 1

    GeneratedDocumentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedDocument'

    # ---------------------------------------------------------------------------
    # Chat
    # ---------------------------------------------------------------------------

    CreateSessionRequest:
      type: object
      properties:
        session_type:
          type: string
          enum: [insight_chat, cover_letter_chat, fit_analysis_chat]
          default: insight_chat
          description: Type of chat session

    SessionResponse:
      type: object
      required: [id, user_id, session_type, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        application_id:
          type: ['string', 'null']
          format: uuid
          description: >-
            The job application this conversation is about, bound the first time one is
            referenced. Present when the chat was started from an application or one was
            chosen for a document command; null for a general chat. The UI uses it to know
            where a generated cover letter or resume would be saved.
        session_type:
          type: string
          enum: [insight_chat, cover_letter_chat, fit_analysis_chat]
        summary:
          type: ['string', 'null']
          description: AI-generated memory summary, set after enough messages accumulate
        first_message:
          type: ['string', 'null']
          description: First user message in the session — used as the display title in the UI
        created_at:
          type: string
          format: date-time

    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionResponse'

    MessageItem:
      type: object
      required: [id, role, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        created_at:
          type: string
          format: date-time

    MessageListResponse:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageItem'

    MessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 8000

    MessageResponse:
      type: object
      required: [response]
      properties:
        response:
          type: string
